
name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}
        run: |
          if [ -z "$VITE_TLDRAW_LICENSE_KEY" ]; then
            echo "::error::Set the TLDRAW_LICENSE_KEY repository secret for the Capacitor iOS release build."
            exit 1
          fi
          npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry CardinalNotes.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CardinalNotes-iOS
          path: CardinalNotes.ipa
